<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#002400;overflow:hidden}
canvas{display:block}
</style></head><body><canvas id="c" width="848" height="208"></canvas>
<script>
// «Star the repo» — the same visual language as git-fork.gif: the dark green field, the black glowing pill on the left, the button on
// the right, an arrow cursor. On the click the star pops gold with a soft flash and three bursts of fireworks.
const W = 848, H = 208, T = 4.4
const C = { bg: '#002400', pill: '#000500', cream: '#fdf8c4', btn: '#1e3e16', btnDone: '#2a3d10', gold: '#fcd34d', amber: '#f59e0b', teal: '#5eead4', white: '#fff8e1', grey: '#a3a99a' }
const FONT = '700 34px -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif'
const ctx = document.getElementById('c').getContext('2d')
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const ease = (x) => 1 - Math.pow(1 - x, 3)
const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
const mix = (a, b, k) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, '0')).join('') }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath() }

function star(cx, cy, R, rot = 0) {
  const r = R * 0.48
  ctx.beginPath()
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + rot + (i * Math.PI) / 5; const rad = i % 2 ? r : R; ctx.lineTo(cx + rad * Math.cos(a), cy + rad * Math.sin(a)) }
  ctx.closePath()
}

function cursor(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s)
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.lineTo(7.5, 23); ctx.lineTo(12.5, 34); ctx.lineTo(17, 32); ctx.lineTo(12, 21.5); ctx.lineTo(22, 21.5); ctx.closePath()
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000000'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.fill(); ctx.stroke(); ctx.restore()
}

function glowText(text, x, y, color, glow, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = FONT; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'
  if (glow > 0) { ctx.shadowColor = 'rgba(253,248,196,0.85)'; ctx.shadowBlur = 14 * glow; ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.shadowBlur = 6 * glow; ctx.fillText(text, x, y) }
  ctx.shadowBlur = 0; ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.restore()
}

// Fireworks: three bursts, each a ring of sparks with a short trail; a fixed seed — every render of a time draws the same frame.
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
const PALETTE = [C.gold, C.amber, C.cream, C.teal, '#fde68a']
const BURSTS = [0, 1, 2].map((k) => {
  const t0 = 1.6 + k * 0.24, n = 18 + k * 4, sparks = []
  const ox = 490 + [0, -34, 38][k], oy = 100 + [0, -22, 10][k]
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2 + rnd() * 0.3; sparks.push({ a, v: 80 + rnd() * 85, c: PALETTE[Math.floor(rnd() * PALETTE.length)], s: 1.9 + rnd() * 1.8 }) }
  return { t0, ox, oy, sparks, life: 1.05 }
})
const TWINKLES = Array.from({ length: 9 }, () => ({ x: 430 + rnd() * 360, y: 60 + rnd() * 90, t0: 2.2 + rnd() * 1.4, s: 3 + rnd() * 3 }))

function sparkle(x, y, s, k) { ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = C.cream; ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.25, y - s * 0.25); ctx.lineTo(x + s, y); ctx.lineTo(x + s * 0.25, y + s * 0.25); ctx.lineTo(x, y + s); ctx.lineTo(x - s * 0.25, y + s * 0.25); ctx.lineTo(x - s, y); ctx.lineTo(x - s * 0.25, y - s * 0.25); ctx.closePath(); ctx.fill(); ctx.restore() }

// The loop: the last 0.5 s dip to the field and come back up on the first frame — no two states overlap.
function render(t) {
  const k = seg(t, T - 0.5, T)
  if (k > 0) { draw(k < 0.5 ? 3.85 : 0); ctx.fillStyle = `rgba(0,36,0,${k < 0.5 ? k * 2 : (1 - k) * 2})`; ctx.fillRect(0, 0, W, H); return }
  draw(t)
}

function draw(t) {
  const back = 0
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H)
  const done = ease(seg(t, 1.58, 1.95)) * (1 - back)
  const hover = ease(seg(t, 1.05, 1.35)) * (1 - back)
  // ── left: the pill «Enjoying it?» → «Star the repo!»
  const swap = easeIO(seg(t, 2.05, 2.5)) * (1 - back)
  ctx.save(); ctx.globalAlpha = 1 - swap; rr(22, 52, 356, 102, 14); ctx.fillStyle = C.pill; ctx.fill(); ctx.restore()
  const pulse = 0.75 + 0.25 * Math.sin(t * 3.2)
  glowText('Enjoying it?', 200, 104 - swap * 8, C.cream, pulse, 1 - swap)
  glowText('Star the repo!', 200, 104 + (1 - swap) * 8, '#f4f1dc', 0, swap)
  // ── right: the button
  const bx = 400, by = 50, bw = 404, bh = 110
  ctx.save(); rr(bx, by, bw, bh, 16)
  ctx.fillStyle = mix(mix(C.btn, '#28501d', hover * (1 - done)), C.btnDone, done); ctx.fill()
  ctx.lineWidth = 2; ctx.strokeStyle = done > 0 ? `rgba(252,211,77,${0.18 + 0.5 * done})` : `rgba(255,255,255,${0.12 + 0.1 * hover})`; ctx.stroke(); ctx.restore()
  // the flash behind the star: a soft gold glow that breathes out
  const sx = 490, sy = 105
  const fl = seg(t, 1.55, 2.25)
  if (fl > 0 && fl < 1) { const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 30 + 110 * ease(fl)); g.addColorStop(0, `rgba(253,230,138,${0.85 * (1 - fl)})`); g.addColorStop(0.35, `rgba(252,211,77,${0.45 * (1 - fl)})`); g.addColorStop(1, 'rgba(252,211,77,0)'); ctx.fillStyle = g; ctx.fillRect(bx - 40, 0, 360, H) }
  // the ring of the click
  const ring = seg(t, 1.5, 1.95)
  if (ring > 0 && ring < 1) { ctx.save(); ctx.globalAlpha = 1 - ring; ctx.strokeStyle = C.gold; ctx.lineWidth = 3 * (1 - ring) + 0.5; ctx.beginPath(); ctx.arc(sx, sy, 20 + 52 * ease(ring), 0, Math.PI * 2); ctx.stroke(); ctx.restore() }
  // fireworks
  for (const b of BURSTS) {
    const k = (t - b.t0) / b.life
    if (k <= 0 || k >= 1 || back > 0) continue
    for (const p of b.sparks) {
      const d = p.v * ease(k), x = b.ox + Math.cos(p.a) * d, y = b.oy + Math.sin(p.a) * d + 18 * k * k
      const tail = p.v * ease(Math.max(0, k - 0.08)), x2 = b.ox + Math.cos(p.a) * tail, y2 = b.oy + Math.sin(p.a) * tail + 18 * Math.max(0, k - 0.08) ** 2
      ctx.save(); ctx.globalAlpha = (1 - k) * 0.9; ctx.strokeStyle = p.c; ctx.lineWidth = p.s * 0.7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x, y); ctx.stroke()
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(x, y, p.s * (1 - k * 0.6), 0, Math.PI * 2); ctx.fill(); ctx.restore()
    }
  }
  for (const w of TWINKLES) { const k = seg(t, w.t0, w.t0 + 0.6); if (k > 0 && k < 1 && back === 0) sparkle(w.x, w.y, w.s, Math.sin(k * Math.PI) * 0.9) }
  // the star: grey → gold, a pop
  const pop = seg(t, 1.55, 1.95)
  const scale = 1 + 0.38 * Math.sin(Math.PI * pop) * (1 - back)
  ctx.save(); star(sx, sy, 27 * scale, 0)
  ctx.fillStyle = mix(C.grey, C.gold, done)
  if (done > 0) { ctx.shadowColor = 'rgba(252,211,77,0.8)'; ctx.shadowBlur = 16 * done }
  ctx.fill(); ctx.shadowBlur = 0; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.strokeStyle = mix('#c8ccc0', C.amber, done); ctx.stroke(); ctx.restore()
  // the label: «Star Repo» → «Starred»
  const lab = easeIO(seg(t, 1.7, 2.05)) * (1 - back)
  ctx.save(); ctx.font = FONT; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'
  ctx.globalAlpha = 1 - lab; ctx.fillStyle = '#e9f0d8'; ctx.fillText('Star Repo', 552 + lab * 14, 106)
  ctx.globalAlpha = lab; ctx.fillStyle = C.white; ctx.fillText('Starred', 552 - (1 - lab) * 10, 106); ctx.restore()
  // the cursor: in from the lower right, hover, click, rest, out
  const inK = easeIO(seg(t, 0.25, 1.15)), outK = easeIO(seg(t, 3.0, 3.75))
  const cx = 860 - (860 - 600) * inK + 300 * outK, cy = 240 - (240 - 112) * inK + 140 * outK
  const press = seg(t, 1.45, 1.58) - seg(t, 1.58, 1.72)
  if (cx < W + 30) cursor(cx, cy, 1 - 0.12 * clamp(press, 0, 1))
}

window.render = render
const m = location.hash.match(/t=([\d.]+)/)
render(m ? Number(m[1]) : 1.9)
</script></body></html>
