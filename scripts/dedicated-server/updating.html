<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="30">
<title>Updating · Обновляется</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  p { margin: 0.5rem 0; opacity: 0.8; }
</style>
</head>
<body>
<main data-block="node-updating">
  <h1>The site is updating</h1>
  <p>It will be back in a few minutes. This page refreshes by itself.</p>
  <h1 lang="ru">Сайт обновляется</h1>
  <p lang="ru">Он вернётся через несколько минут. Страница обновится сама.</p>
</main>
</body>
</html>
