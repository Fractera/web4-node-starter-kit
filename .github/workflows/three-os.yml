# Три системы: Ubuntu, macOS, Windows (заведено шагом 258, 2026-09-20).
#
# 🔒 ЗАЧЕМ. Продукт ставится на ДОМАШНЮЮ машину человека, а машин три рода.
# Разрабатывается он на Windows, и два класса отказов на ней не возникают в
# принципе: регистр в путях (Linux строже) и нативные сборки под чужую
# архитектуру. Раннеры GitHub дают обе системы даром, пока репозиторий публичный.
#
# 🛑 ЧТО ЭТОТ ПРОГОН НЕ ДОКАЗЫВАЕТ, И ЭТО ВАЖНЕЕ ТОГО, ЧТО ОН ДОКАЗЫВАЕТ:
#   · установку «одной фразой» — раннер не человек за своим компьютером;
#   · автозапуск при загрузке (systemd, launchd, папка автозагрузки);
#   · pm2 startup с sudo, туннель, cloudflared — их здесь нет намеренно;
#   · linux-arm64 и musl (Alpine): раннер даёт x64-glibc, а Мак — arm64-darwin.
# Зелёный цвет здесь означает «код собирается на трёх системах», а не
# «продукт на них работает». Второе доказывается только живым прогоном.

name: three-os

# 🔒 macOS — НЕ НА КАЖДУЮ ОТПРАВКУ (узел, 2026-11-04). Владелец: «почему у меня там такое количество странных сообщений … какая может
# быть системное решение такой проблемы?». Измерено: из 13 неудачных прогонов с 2026-11-03 одиннадцать — «The job was not acquired by
# Runner of type hosted even after multiple attempts» (у GitHub нет свободной машины macOS arm64), Linux и Windows в них зелёные; два —
# настоящая поломка на всех трёх. Поэтому: отправка в main — Linux и Windows; все три системы — раз в сутки, на метке версии, в pull
# request и по кнопке. Документы не пропускаются: сторожа сборки читают и их (ссылки, шаги).
# Отправки подряд: проверяется последняя, прежний прогон той же ветки отменяется.
on:
  push:
    branches: ["main", "new-step-*"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: three-os-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # системы отчитываются независимо: расхождение колонок и есть ответ
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Зависимости (здесь падают нативные сборки под чужую архитектуру)
        run: npm ci

      - name: Рождение конфигурации — иначе список языков пуст и сборка падает
        shell: bash
        run: cp .env.local.example .env.local
        # 🛑 ИЗМЕРЕНО ШАГОМ 258: .env.local читают семь скриптов и НЕ ПИШЕТ НИ ОДИН,
        # а процедура установки о нём молчит. Чистый клон без него даёт 210 нарушений
        # check-content («язык не включён ()») на ВСЕХ ТРЁХ системах одинаково.
        # Здесь это не обход дефекта, а повторение того, что обязан сделать установщик.
      - name: Регистр в путях (на Windows и macOS всегда зелено — красным бывает только Linux)
        run: npm run check:case

      - name: Сборка со всеми сторожами
        run: npm run build
